<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios - Sistema Tienda</title>
  <link rel="stylesheet" href="/assets/css/sidebar.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e293b;
      color: #f1f5f9;
      padding: 30px;
    }

    .contenedor {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .mensaje {
      margin-bottom: 15px;
      padding: 10px 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .mensaje.ok {
      display: block;
      background-color: #14532d;
      color: #86efac;
    }

    .mensaje.error {
      display: block;
      background-color: #7f1d1d;
      color: #fca5a5;
    }

    .panel {
      background-color: #0f172a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    input, select {
      background-color: #1e293b;
      color: #f1f5f9;
    }

    button {
      background-color: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .tabla-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #0f172a;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }

    th {
      background-color: #1e293b;
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      background-color: #1e3a5f;
      color: #bfdbfe;
    }

    .badge.activo {
      background-color: #14532d;
      color: #86efac;
    }

    .badge.inactivo {
      background-color: #7f1d1d;
      color: #fca5a5;
    }

    .subtitulo {
      color: #94a3b8;
      margin-top: -10px;
      margin-bottom: 14px;
    }

    @media (max-width: 900px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="globalSidebar"></div>
  <div class="contenedor">
    <h1>Gestión de Usuarios</h1>
    <p class="subtitulo">Crea nuevos usuarios y revisa cuándo ingresaron al sistema.</p>

    <div id="mensaje" class="mensaje"></div>

    <div class="panel">
      <h2 style="margin-top:0; font-size:18px;">Crear usuario nuevo</h2>
      <form id="formUsuario">
        <div class="form-grid">
          <div>
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" required>
          </div>
          <div>
            <label for="usuario">Usuario</label>
            <input id="usuario" name="usuario" required>
          </div>
          <div>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required>
          </div>
          <div>
            <label for="rol">Rol</label>
            <select id="rol" name="rol">
              <option value="vendedor">Vendedor</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
          <div style="grid-column: 1 / -1;">
            <button type="submit">Guardar usuario</button>
          </div>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2 style="margin-top:0; font-size:18px;">Usuarios registrados</h2>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Último ingreso</th>
              <th>Creado</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin-top:0; font-size:18px;">Últimos accesos</h2>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Hora de entrada</th>
            </tr>
          </thead>
          <tbody id="tablaAccesos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/assets/js/sidebar.js"></script>
  <script src="/assets/js/usuarios.js"></script>
</body>
</html>
