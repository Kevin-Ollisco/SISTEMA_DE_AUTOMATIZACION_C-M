<!-- frontend/views/pos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Punto de Venta - Sistema Tienda</title>
  <link rel="stylesheet" href="/assets/css/pos.css">
  <link rel="stylesheet" href="/assets/css/sidebar.css">
</head>
<body>
  <div id="globalSidebar"></div>
  <div class="contenedor-pos">
    <div class="panel-productos">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>Nueva Venta</h1>
        <div style="font-size:13px; color:#94a3b8;">
          <span id="nombreUsuarioActivo"></span>
          <button onclick="cerrarSesion()" style="margin-left:10px; background:#334155; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px;">Cerrar sesión</button>
        </div>
      </div>
      <input type="text" id="buscadorPos" class="buscador-pos" placeholder="Buscar producto por nombre o código..." autofocus>
      <div class="grid-productos" id="gridProductos"></div>
    </div>

    <div class="panel-carrito">
      <h1>Carrito</h1>
      <div class="lista-carrito" id="listaCarrito"></div>

      <div class="resumen-total">
        <label style="font-size:13px;color:#94a3b8;display:block;margin-bottom:6px;">Método de pago</label>
        <select id="metodoPago" style="width:100%;padding:10px;margin-bottom:15px;border-radius:6px;border:none;background-color:#1e293b;color:#f1f5f9;">
          <option value="efectivo">Efectivo</option>
          <option value="tarjeta">Tarjeta</option>
          <option value="qr">QR / Transferencia</option>
        </select>
        <div class="fila-total">
          <span>Total</span>
          <span id="totalVenta">Bs 0.00</span>
        </div>
        <button class="btn-cobrar" id="btnCobrar" disabled>Cobrar</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/sidebar.js"></script>
  <script src="/assets/js/pos.js"></script>
</body>
</html>
