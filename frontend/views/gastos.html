<!-- frontend/views/gastos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gastos - Sistema Tienda</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e293b;
      color: #f1f5f9;
      padding: 30px;
    }
    h1 { margin-top: 0; }
    .contenedor { max-width: 700px; margin: 0 auto; }
    .formulario {
      background-color: #0f172a;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }
    .formulario label {
      font-size: 13px;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    .formulario input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background-color: #1e293b;
      color: #f1f5f9;
    }
    .formulario button {
      grid-column: 1 / -1;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .formulario button:hover { background-color: #1d4ed8; }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #0f172a;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
    th { background-color: #1e293b; }
    .btn-eliminar { background: none; border: none; color: #f87171; cursor: pointer; font-size: 14px; }
    .total-gastos {
      text-align: right;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      color: #fbbf24;
    }
    #mensaje {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .ok { background-color: #14532d; color: #86efac; display: block !important; }
    .error { background-color: #7f1d1d; color: #fca5a5; display: block !important; }
  </style>
  <link rel="stylesheet" href="/assets/css/sidebar.css">
</head>
<body>
  <div id="globalSidebar"></div>
  <div class="contenedor">
    <h1>Registro de Gastos</h1>

    <div id="mensaje"></div>

    <div class="formulario">
      <div>
        <label>Concepto del gasto</label>
        <input type="text" id="concepto" placeholder="Ej: Pago de luz, alquiler, transporte...">
      </div>
      <div>
        <label>Monto (Bs)</label>
        <input type="text" id="monto" data-decimal="true" placeholder="Ej: 150">
      </div>
      <button onclick="registrarGasto()">Registrar Gasto</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Concepto</th>
          <th>Monto</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tablaGastos"></tbody>
    </table>

    <div class="total-gastos" id="totalGastos">Total: Bs 0.00</div>
  </div>

  <script>
    const API_GASTOS = 'http://localhost:3000/api/gastos';

    function mostrarMensaje(texto, tipo) {
      const div = document.getElementById('mensaje');
      div.textContent = texto;
      div.className = tipo;
      setTimeout(() => {
        div.className = '';
        div.textContent = '';
      }, 3000);
    }

    async function cargarGastos() {
      const res = await fetch(API_GASTOS);
      const data = await res.json();
      const tbody = document.getElementById('tablaGastos');
      tbody.innerHTML = '';

      if (!data.ok) return;

      let total = 0;

      data.gastos.forEach(gasto => {
        total += gasto.monto;
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${gasto.fecha}</td>
          <td>${gasto.concepto}</td>
          <td>Bs ${gasto.monto.toFixed(2)}</td>
          <td><button class="btn-eliminar" onclick="eliminarGasto(${gasto.id})">Eliminar</button></td>
        `;
        tbody.appendChild(fila);
      });

      document.getElementById('totalGastos').textContent = `Total: Bs ${total.toFixed(2)}`;
    }

    async function registrarGasto() {
      const concepto = document.getElementById('concepto').value;
      const monto = document.getElementById('monto').value;

      const res = await fetch(API_GASTOS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ concepto, monto })
      });

      const data = await res.json();

      if (data.ok) {
        mostrarMensaje('Gasto registrado', 'ok');
        document.getElementById('concepto').value = '';
        document.getElementById('monto').value = '';
        cargarGastos();
      } else {
        mostrarMensaje(data.mensaje, 'error');
      }
    }

    async function eliminarGasto(id) {
      if (!confirm('¿Eliminar este gasto?')) return;

      const res = await fetch(`${API_GASTOS}/${id}`, { method: 'DELETE' });
      const data = await res.json();

      if (data.ok) {
        mostrarMensaje('Gasto eliminado', 'ok');
        cargarGastos();
      }
    }

    cargarGastos();
  </script>
  <script src="/assets/js/sidebar.js"></script>
</body>
</html>
